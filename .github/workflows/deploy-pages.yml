name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - claude/seido-navi-db-publish-9t2kq4
      - main
  workflow_dispatch:

# github-pages 環境ゲートを避けるため、ビルド成果物(docs/)を gh-pages ブランチへ
# 直接 push する方式。GITHUB_TOKEN の contents:write のみで動作する。
permissions:
  contents: write

concurrency:
  group: deploy-gh-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish docs/ to gh-pages branch
        run: |
          set -euo pipefail
          SRC="docs"
          test -f "$SRC/index.html" || { echo "docs/index.html not found"; exit 1; }

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 公開ブランチを作り直して docs/ の中身をルートに配置
          rm -rf .gh-pages-publish
          mkdir .gh-pages-publish
          cp -a "$SRC/." .gh-pages-publish/
          touch .gh-pages-publish/.nojekyll

          cd .gh-pages-publish
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git commit -q -m "Deploy site to GitHub Pages ($GITHUB_SHA)"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
